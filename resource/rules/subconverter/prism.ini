[custom]
; Prism Rules Configuration for Subconverter
; 完整版配置 - 包含所有服务和策略组
; Generated at: 2025-10-02T12:48:09+08:00
; Repository: https://github.com/darabuchi/prism
;
; 使用方法：
; 1. 将此文件放到 subconverter 的 base 目录下
; 2. 在订阅转换时使用 &config=prism 参数引用此配置
; 3. 示例: https://your-subconverter.com/sub?target=clash&url=<订阅链接>&config=prism
;

; ============ 基础配置 ============

; 启用规则生成器
enable_rule_generator=true
; 覆盖原有规则
overwrite_original_rules=true
; 跳过证书验证
skip_cert_verify_flag=false
; UDP 支持
udp_flag=true
; TCP Fast Open
tcp_fast_open_flag=true

; Clash 配置基础模板（可选）
; clash_rule_base=https://raw.githubusercontent.com/darabuchi/prism/main/config/clash_base.yaml
; Quantumult X 配置基础模板（可选）
; quanx_rule_base=https://raw.githubusercontent.com/darabuchi/prism/main/config/quanx_base.conf

; ============ 策略组配置 ============

; 主节点选择 - 提供多种策略选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔀 负载均衡`[]🔄 故障转移`[]📌 手动切换`[]DIRECT`[]REJECT
; 自动选择 - URL 测试选择最低延迟节点
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
; 负载均衡 - 多节点负载均衡
custom_proxy_group=🔀 负载均衡`load-balance`.*`http://www.gstatic.com/generate_204`300,,50
; 故障转移 - 自动切换到可用节点
custom_proxy_group=🔄 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300,,50
; 手动切换 - 手动选择节点
custom_proxy_group=📌 手动切换`select`.*`http://www.gstatic.com/generate_204`300,,1

