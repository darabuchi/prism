[custom]
; Prism Rules Mini Configuration for Subconverter
; 精简版配置 - 仅包含基础策略组和常用服务
; Generated at: 2025-10-02T13:59:29+08:00
; Repository: https://github.com/darabuchi/prism
;
; 使用方法：
; 1. 将此文件放到 subconverter 的 base 目录下
; 2. 在订阅转换时使用 &config=prism_mini 参数引用此配置
; 3. 示例: https://your-subconverter.com/sub?target=clash&url=<订阅链接>&config=prism_mini
;

; ============ 基础配置 ============

; 启用规则生成器
enable_rule_generator=true
; 覆盖原有规则
overwrite_original_rules=true
; 跳过证书验证
skip_cert_verify_flag=false
; UDP 支持
udp_flag=true
; TCP Fast Open
tcp_fast_open_flag=true

; Clash 配置基础模板（可选）
; clash_rule_base=https://raw.githubusercontent.com/darabuchi/prism/main/config/clash_base.yaml
; Quantumult X 配置基础模板（可选）
; quanx_rule_base=https://raw.githubusercontent.com/darabuchi/prism/main/config/quanx_base.conf

; ============ 策略组配置 ============

; 主节点选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
; 自动选择
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

; 流媒体服务

; 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
; 广告拦截
custom_proxy_group=🛡️ 广告拦截`select`[]REJECT`[]DIRECT
; 漏网之鱼
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]DIRECT

